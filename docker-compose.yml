x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    mem_limit: 512m
    logging: *logging

  bot:
    build: .
    image: resave:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BOT_API_BASE_URL: http://telegram-bot-api:8081
      BOT_API_IS_LOCAL: "true"
      BOT_API_USE_FILE_URI: "false"
      TEMP_DIR: /data/downloads
      STATS_DB_PATH: /data/database.db
      COOKIES_FILE: /data/cookies.txt
      LOG_FILE: /data/bot.log
      PACKAGES_DIR: /data/packages
      RESAVE_LOCK_PATH: /data/.resave.lock
    volumes:
      - bot-data:/data
    depends_on:
      - telegram-bot-api
    mem_limit: 2g
    stop_grace_period: 30s
    logging: *logging

volumes:
  bot-api-data:
  bot-data:
